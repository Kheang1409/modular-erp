name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.112
      - run: dotnet restore Erp.slnx
      - run: dotnet format Erp.slnx --verify-no-changes --no-restore
      - run: dotnet build Erp.slnx --configuration Release --no-restore
      - name: Package and install the community module sample
        shell: pwsh
        run: |
          ./eng/pack-module.ps1 -Project samples/CommunityHello/CommunityHello.csproj -OutputRoot artifacts/community-module
          dotnet run --project src/Tools/Erp.Cli --configuration Release --no-build -- module validate artifacts/community-module/community.hello-0.1.0.erpmod
          dotnet run --project src/Tools/Erp.Cli --configuration Release --no-build -- module install artifacts/community-module/community.hello-0.1.0.erpmod --root artifacts/community-install
          dotnet run --project src/Tools/Erp.Cli --configuration Release --no-build -- module disable community.hello --root artifacts/community-install
          dotnet run --project src/Tools/Erp.Cli --configuration Release --no-build -- module enable community.hello --root artifacts/community-install
      - run: dotnet list Erp.slnx package --vulnerable --include-transitive
      - name: Unit tests
        run: dotnet test tests/UnitTests/Erp.UnitTests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/unit
      - name: Architecture tests
        run: dotnet test tests/ArchitectureTests/Erp.ArchitectureTests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/architecture
      - name: Check Docker integration test prerequisite
        run: docker info --format '{{.ServerVersion}}'
      - name: Build disposable S3 test fixture with visible progress
        timeout-minutes: 15
        run: docker buildx build --builder default --load --progress plain --tag erp-minio-ci-fixture:${{ github.sha }} tests/IntegrationTests/Fixtures/Minio
      - name: PostgreSQL and storage integration tests
        env:
          CI: 'true'
        run: dotnet test tests/IntegrationTests/Erp.IntegrationTests.csproj --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results/integration
      - name: Preserve test diagnostics
        if: always()
        shell: pwsh
        run: ./.github/scripts/write-test-summary.ps1 -ResultsRoot artifacts/test-results
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-results
          path: artifacts/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: warn
      - if: github.ref == 'refs/heads/main'
        run: docker build -t open-erp:${{ github.sha }} .
      - if: github.ref == 'refs/heads/main'
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed open-erp:${{ github.sha }}
      - run: docker run --rm -v "${{ github.workspace }}:/workspace" aquasec/trivy:0.74.0 config --exit-code 1 --severity HIGH,CRITICAL /workspace

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    env:
      ERP_ADMIN_EMAIL: e2e@example.test
      ERP_ADMIN_PASSWORD: E2e-Only-Password-14092020!
      ERP_E2E_BASE_URL: http://localhost:8080
      ERP_E2E_EMAIL: e2e@example.test
      ERP_E2E_PASSWORD: E2e-Only-Password-14092020!
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.112
      - run: dotnet restore Erp.slnx
      - run: docker compose up -d --build --wait
      - name: Wait for application HTTP readiness
        timeout-minutes: 3
        shell: bash
        run: |
          erp_http_status="$(curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 10 \
            --retry 24 --retry-delay 5 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            --write-out '%{http_code}' \
            "$ERP_E2E_BASE_URL/health/ready")"
          test "$erp_http_status" = "200"
      - run: dotnet build tests/EndToEndTests/Erp.EndToEndTests.csproj --no-restore
      - run: pwsh tests/EndToEndTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Browser workflows and responsive accessibility checks
        run: dotnet test tests/EndToEndTests/Erp.EndToEndTests.csproj --no-build --no-restore --logger trx --results-directory artifacts/test-results/browser
      - name: Preserve browser test diagnostics
        if: always()
        shell: pwsh
        run: ./.github/scripts/write-test-summary.ps1 -ResultsRoot artifacts/test-results/browser
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            artifacts/test-results/browser/**/*.trx
            tests/EndToEndTests/bin/Debug/net10.0/reports-dashboard-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Rehearse PostgreSQL backup and isolated restore
        run: docker compose exec -T postgres pg_dump --username=erp --dbname=erp --format=custom --file=/tmp/erp-ci.dump
      - run: docker compose exec -T postgres createdb --username=erp erp_restore
      - run: docker compose exec -T postgres pg_restore --username=erp --dbname=erp_restore --exit-on-error /tmp/erp-ci.dump
      - name: Verify restored module data structures
        run: test "$(docker compose exec -T postgres psql --username=erp --dbname=erp_restore --tuples-only --no-align --command="SELECT to_regclass('platform.tenants') IS NOT NULL AND to_regclass('inventory.stock_moves') IS NOT NULL AND to_regclass('accounting.journal_entries') IS NOT NULL;")" = "t"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
